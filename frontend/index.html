<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ResearchMind — AI 用户研究平台</title>
<style>
/* ── 设计系统变量 ── */
:root {
  --bg: #0a0a0f;
  --surface: #13131a;
  --surface2: #1c1c26;
  --surface3: #252530;
  --border: #2a2a38;
  --border-hover: #3d3d52;
  --accent: #7c6af7;
  --accent-dim: rgba(124,106,247,0.15);
  --accent-glow: rgba(124,106,247,0.4);
  --green: #34d399;
  --yellow: #fbbf24;
  --red: #f87171;
  --blue: #60a5fa;
  --text-primary: #e8e8f0;
  --text-secondary: #9999b0;
  --text-dim: #555570;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
  --mono: "SF Mono", "Fira Code", monospace;
  --radius: 12px;
  --radius-sm: 8px;
  --transition: 0.2s ease;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text-primary);
  font-family: var(--font);
  font-size: 14px;
  height: 100vh;
  display: flex;
  overflow: hidden;
}

/* ── 左侧边栏 ── */
.sidebar {
  width: 260px;
  min-width: 260px;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  padding: 20px 0;
}

.sidebar-logo {
  padding: 0 20px 24px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 20px;
}

.logo-text {
  font-size: 18px;
  font-weight: 700;
  background: linear-gradient(135deg, #7c6af7 0%, #a78bfa 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  letter-spacing: -0.3px;
}

.logo-sub {
  font-size: 11px;
  color: var(--text-dim);
  margin-top: 2px;
}

.sidebar-section {
  padding: 0 12px;
  margin-bottom: 24px;
}

.sidebar-section-title {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  color: var(--text-dim);
  padding: 0 8px;
  margin-bottom: 8px;
}

.sidebar-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 12px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: var(--transition);
  color: var(--text-secondary);
  font-size: 13.5px;
}

.sidebar-item:hover {
  background: var(--surface2);
  color: var(--text-primary);
}

.sidebar-item.active {
  background: var(--accent-dim);
  color: #c4b9ff;
}

.sidebar-item .icon { font-size: 15px; }

.sidebar-item .badge {
  margin-left: auto;
  background: var(--accent);
  color: white;
  border-radius: 10px;
  padding: 1px 7px;
  font-size: 10px;
  font-weight: 600;
}

/* ── 主体区域 ── */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* 顶部导航 */
.topbar {
  height: 56px;
  min-height: 56px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 24px;
  gap: 16px;
  background: var(--surface);
}

.topbar-title {
  font-size: 15px;
  font-weight: 600;
  color: var(--text-primary);
}

.study-badge {
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--surface3);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 4px 12px;
  font-size: 12px;
  color: var(--text-secondary);
}

.study-badge .dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--green);
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

.topbar-actions {
  margin-left: auto;
  display: flex;
  gap: 8px;
}

.btn {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 7px 14px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: var(--transition);
  border: none;
  font-family: var(--font);
}

.btn-ghost {
  background: transparent;
  color: var(--text-secondary);
  border: 1px solid var(--border);
}

.btn-ghost:hover {
  background: var(--surface3);
  color: var(--text-primary);
  border-color: var(--border-hover);
}

.btn-primary {
  background: var(--accent);
  color: white;
}

.btn-primary:hover {
  background: #9580ff;
  box-shadow: 0 0 20px var(--accent-glow);
}

/* ── 对话区 ── */
.chat-area {
  flex: 1;
  overflow-y: auto;
  padding: 32px 0;
  scroll-behavior: smooth;
}

.chat-area::-webkit-scrollbar { width: 4px; }
.chat-area::-webkit-scrollbar-track { background: transparent; }
.chat-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.messages-container {
  max-width: 800px;
  margin: 0 auto;
  padding: 0 24px;
  display: flex;
  flex-direction: column;
  gap: 24px;
}

/* 欢迎屏 */
.welcome-screen {
  text-align: center;
  padding: 80px 24px 40px;
  max-width: 600px;
  margin: 0 auto;
}

.welcome-icon {
  font-size: 48px;
  margin-bottom: 20px;
  display: block;
}

.welcome-title {
  font-size: 28px;
  font-weight: 700;
  margin-bottom: 12px;
  background: linear-gradient(135deg, #e8e8f0 0%, #9999b0 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.welcome-sub {
  color: var(--text-secondary);
  font-size: 15px;
  line-height: 1.6;
  margin-bottom: 40px;
}

.example-cards {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  text-align: left;
}

.example-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  cursor: pointer;
  transition: var(--transition);
}

.example-card:hover {
  border-color: var(--accent);
  background: var(--accent-dim);
}

.example-card-icon { font-size: 20px; margin-bottom: 8px; }

.example-card-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 4px;
}

.example-card-desc {
  font-size: 12px;
  color: var(--text-secondary);
  line-height: 1.4;
}

/* 用户消息 */
.msg-user {
  display: flex;
  justify-content: flex-end;
}

.msg-user .bubble {
  background: var(--accent);
  color: white;
  padding: 12px 16px;
  border-radius: 18px 18px 4px 18px;
  max-width: 70%;
  line-height: 1.5;
  font-size: 14px;
  word-break: break-word;
}

/* Agent 消息 */
.msg-agent {
  display: flex;
  gap: 12px;
  align-items: flex-start;
}

.agent-avatar {
  width: 36px;
  height: 36px;
  min-width: 36px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--accent) 0%, #a78bfa 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
}

.agent-content { flex: 1; min-width: 0; }

.agent-name {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-dim);
  margin-bottom: 6px;
}

/* 执行步骤卡片 */
.step-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  transition: var(--transition);
}

.step-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 16px;
  cursor: pointer;
  user-select: none;
}

.step-header:hover { background: var(--surface2); }

.step-status-icon {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  flex-shrink: 0;
}

.step-status-icon.pending {
  background: var(--surface3);
  color: var(--text-dim);
}

.step-status-icon.running {
  background: rgba(251,191,36,0.15);
  color: var(--yellow);
  animation: spin 1.5s linear infinite;
}

.step-status-icon.done {
  background: rgba(52,211,153,0.15);
  color: var(--green);
}

.step-status-icon.error {
  background: rgba(248,113,113,0.15);
  color: var(--red);
}

@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

.step-info { flex: 1; }

.step-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-primary);
}

.step-desc {
  font-size: 12px;
  color: var(--text-secondary);
  margin-top: 2px;
}

.step-expand-icon {
  color: var(--text-dim);
  font-size: 12px;
  transition: var(--transition);
}

.step-body {
  border-top: 1px solid var(--border);
  padding: 16px;
  display: none;
}

.step-body.visible { display: block; }

/* 流式文本输出 */
.streaming-text {
  font-size: 14px;
  line-height: 1.7;
  color: var(--text-primary);
  white-space: pre-wrap;
  word-break: break-word;
}

/* Markdown 渲染 */
.markdown h1 { font-size: 20px; font-weight: 700; margin: 20px 0 12px; color: var(--text-primary); }
.markdown h2 { font-size: 17px; font-weight: 600; margin: 18px 0 10px; color: var(--text-primary); }
.markdown h3 { font-size: 15px; font-weight: 600; margin: 14px 0 8px; color: var(--text-secondary); }
.markdown p { margin: 8px 0; line-height: 1.7; }
.markdown ul, .markdown ol { padding-left: 20px; margin: 8px 0; }
.markdown li { margin: 4px 0; line-height: 1.6; }
.markdown strong { color: var(--text-primary); font-weight: 600; }
.markdown em { color: var(--accent); font-style: italic; }
.markdown code { background: var(--surface3); padding: 2px 6px; border-radius: 4px; font-family: var(--mono); font-size: 12px; color: #c4b9ff; }
.markdown blockquote { border-left: 3px solid var(--accent); padding-left: 12px; color: var(--text-secondary); margin: 8px 0; }
.markdown hr { border: none; border-top: 1px solid var(--border); margin: 16px 0; }

/* 人设卡片网格 */
.personas-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 12px;
  margin-top: 8px;
}

.persona-card {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 14px;
  cursor: pointer;
  transition: var(--transition);
  position: relative;
}

.persona-card:hover, .persona-card.selected {
  border-color: var(--accent);
  background: var(--accent-dim);
}

.persona-card.expanded {
  border-color: var(--accent);
  grid-column: 1 / -1;
}

.persona-card-avatar {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: linear-gradient(135deg, #7c6af7 0%, #34d399 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  margin-bottom: 10px;
}

.persona-card-name {
  font-weight: 600;
  font-size: 13px;
  color: var(--text-primary);
  margin-bottom: 4px;
}

.persona-card-meta {
  font-size: 11px;
  color: var(--text-secondary);
  margin-bottom: 8px;
}

.persona-card-tag {
  display: inline-block;
  background: var(--surface3);
  color: var(--text-secondary);
  font-size: 10px;
  padding: 2px 8px;
  border-radius: 10px;
  margin: 2px 2px 0 0;
}

/* 人设详情展开 */
.persona-expand-icon {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 20px;
  height: 20px;
  border-radius: 4px;
  background: var(--surface3);
  color: var(--text-dim);
  font-size: 10px;
  transition: var(--transition);
  position: absolute;
  top: 8px;
  right: 8px;
  cursor: pointer;
}

.persona-card.expanded .persona-expand-icon {
  transform: rotate(180deg);
}

.persona-detail-panel {
  display: none;
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px solid var(--border);
  font-size: 12px;
  line-height: 1.6;
  color: var(--text-secondary);
}

.persona-card.expanded .persona-detail-panel {
  display: block;
}

.persona-detail-section {
  margin-bottom: 8px;
}

.persona-detail-label {
  font-size: 10px;
  font-weight: 600;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 3px;
}

.persona-detail-value {
  color: var(--text-secondary);
  word-break: break-word;
}

/* 人设增强标记 */
.persona-enriched-badge {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  font-size: 10px;
  color: var(--green);
  background: rgba(52, 211, 153, 0.12);
  padding: 1px 6px;
  border-radius: 8px;
  margin-top: 6px;
}

/* 社媒帖子 */
.post-feed {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.persona-scout-block {
  margin-bottom: 12px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
}

.persona-scout-block:last-child {
  border-bottom: none;
}

.post-item {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px;
  animation: slideIn 0.3s ease;
}

@keyframes slideIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

.post-header {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
}

.post-platform {
  font-size: 11px;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 10px;
}

.post-platform.小红书 { background: rgba(255,80,80,0.15); color: #ff8080; }
.post-platform.微博 { background: rgba(255,102,0,0.15); color: #ff9944; }
.post-platform.抖音 { background: rgba(0,191,255,0.15); color: #44ccff; }

.post-sentiment {
  margin-left: auto;
  font-size: 11px;
  color: var(--text-dim);
}

.post-content {
  font-size: 13px;
  line-height: 1.6;
  color: var(--text-secondary);
}

/* 访谈对话框 */
.interview-chat {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}

/* 自动访谈进度 */
.auto-interview-progress {
  padding: 8px 0;
}

/* 自动访谈人设块 */
.interview-persona-block {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-top: 10px;
  overflow: hidden;
}

/* 访谈结果容器 */
.interview-results {
  margin-top: 8px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.interview-header {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
}

.interview-persona-avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--accent) 0%, var(--blue) 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
}

.interview-persona-name {
  font-weight: 600;
  font-size: 13px;
}

.interview-persona-meta {
  font-size: 11px;
  color: var(--text-secondary);
}

.interview-emotion {
  margin-left: auto;
  font-size: 12px;
  color: var(--text-secondary);
}

.interview-messages {
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  max-height: 280px;
  overflow-y: auto;
}

.interview-msg-q {
  background: var(--surface3);
  border-radius: 8px 8px 8px 2px;
  padding: 10px 12px;
  font-size: 13px;
  color: var(--text-secondary);
}

.interview-msg-a {
  background: var(--accent-dim);
  border: 1px solid rgba(124,106,247,0.2);
  border-radius: 8px 8px 2px 8px;
  padding: 10px 12px;
  font-size: 13px;
  color: var(--text-primary);
  line-height: 1.6;
}

.follow-up-hints {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  padding: 10px 12px;
  border-top: 1px solid var(--border);
}

.hint-chip {
  background: var(--surface3);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 5px 12px;
  font-size: 12px;
  color: var(--text-secondary);
  cursor: pointer;
  transition: var(--transition);
}

.hint-chip:hover {
  border-color: var(--accent);
  color: #c4b9ff;
  background: var(--accent-dim);
}

/* 洞察标签 */
.insights-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.insight-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  background: var(--surface2);
  border-left: 3px solid var(--accent);
  padding: 10px 12px;
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  font-size: 13px;
  color: var(--text-secondary);
  line-height: 1.5;
  animation: slideIn 0.3s ease;
}

/* 交互确认区 */
.confirm-block {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px;
  margin-top: 4px;
}

.confirm-question {
  font-size: 14px;
  font-weight: 500;
  color: var(--text-primary);
  margin-bottom: 12px;
  line-height: 1.5;
}

.confirm-options {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.confirm-btn {
  padding: 8px 16px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: var(--transition);
  border: 1px solid var(--border);
  background: var(--surface3);
  color: var(--text-secondary);
  font-family: var(--font);
}

.confirm-btn:hover {
  border-color: var(--accent);
  color: #c4b9ff;
  background: var(--accent-dim);
}

.confirm-btn.primary {
  background: var(--accent);
  color: white;
  border-color: transparent;
}

.confirm-btn.primary:hover {
  background: #9580ff;
}

/* 进度指示 */
.progress-steps {
  display: flex;
  gap: 8px;
  padding: 12px 16px;
  background: var(--surface2);
  border-bottom: 1px solid var(--border);
  overflow-x: auto;
}

.progress-step {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  border-radius: 20px;
  font-size: 12px;
  white-space: nowrap;
  border: 1px solid transparent;
}

.progress-step.pending { color: var(--text-dim); background: var(--surface3); }
.progress-step.active { color: #c4b9ff; background: var(--accent-dim); border-color: rgba(124,106,247,0.3); }
.progress-step.done { color: var(--green); background: rgba(52,211,153,0.1); border-color: rgba(52,211,153,0.2); }

/* ── 输入区域 ── */
.input-area {
  border-top: 1px solid var(--border);
  padding: 16px 24px 20px;
  background: var(--surface);
}

.input-wrapper {
  max-width: 800px;
  margin: 0 auto;
  position: relative;
}

.input-toolbar {
  display: flex;
  gap: 8px;
  margin-bottom: 10px;
}

.toolbar-btn {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 5px 10px;
  border-radius: 6px;
  font-size: 12px;
  cursor: pointer;
  transition: var(--transition);
  border: 1px solid var(--border);
  background: var(--surface3);
  color: var(--text-secondary);
  font-family: var(--font);
}

.toolbar-btn:hover {
  border-color: var(--border-hover);
  color: var(--text-primary);
}

.input-box {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 50px 14px 16px;
  font-size: 14px;
  color: var(--text-primary);
  width: 100%;
  resize: none;
  font-family: var(--font);
  line-height: 1.5;
  min-height: 52px;
  max-height: 180px;
  outline: none;
  transition: border-color var(--transition);
}

.input-box:focus {
  border-color: var(--accent);
}

.input-box::placeholder { color: var(--text-dim); }

.input-send {
  position: absolute;
  right: 10px;
  bottom: 10px;
  width: 34px;
  height: 34px;
  border-radius: 8px;
  background: var(--accent);
  border: none;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: var(--transition);
  color: white;
  font-size: 16px;
}

.input-send:hover {
  background: #9580ff;
  box-shadow: 0 0 16px var(--accent-glow);
}

.input-send:disabled {
  background: var(--surface3);
  color: var(--text-dim);
  cursor: not-allowed;
  box-shadow: none;
}

/* 附件预览 */
.attachments {
  display: flex;
  gap: 8px;
  margin-bottom: 8px;
  flex-wrap: wrap;
}

.attachment-tag {
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--surface3);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 4px 10px;
  font-size: 12px;
  color: var(--text-secondary);
}

.attachment-remove {
  cursor: pointer;
  color: var(--text-dim);
  font-size: 14px;
}

.attachment-remove:hover { color: var(--red); }

/* 光标闪烁 */
.cursor {
  display: inline-block;
  width: 2px;
  height: 14px;
  background: var(--accent);
  margin-left: 1px;
  animation: blink 1s infinite;
  vertical-align: text-bottom;
}

@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0; }
}

/* 报告展示 */
.report-container {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px;
  margin-top: 4px;
}

/* 加载动画 */
.loading-dots {
  display: flex;
  gap: 4px;
  padding: 8px 0;
}

.loading-dots span {
  width: 6px;
  height: 6px;
  background: var(--accent);
  border-radius: 50%;
  animation: bounce 1.2s ease infinite;
}

.loading-dots span:nth-child(2) { animation-delay: 0.2s; }
.loading-dots span:nth-child(3) { animation-delay: 0.4s; }

@keyframes bounce {
  0%, 60%, 100% { transform: translateY(0); opacity: 0.6; }
  30% { transform: translateY(-6px); opacity: 1; }
}

/* 响应式 */
@media (max-width: 768px) {
  .sidebar { display: none; }
  .example-cards { grid-template-columns: 1fr; }
  .personas-grid { grid-template-columns: 1fr 1fr; }
}

/* 文件上传隐藏 input */
#file-input { display: none; }

/* 过渡动画 */
.fade-in {
  animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>

<script>
// ── 状态管理 ──────────────────────────────────────────────────────

// 自适应 API 地址：开发环境 localhost:8000，生产环境 Vercel 同源
const API_BASE = window.location.hostname === 'localhost' 
  ? 'http://localhost:8000/api/v1'
  : `${window.location.origin}/api/v1`;

const state = {
  studyId: null,
  studyTitle: '新研究',
  phase: 'idle',   // idle | designing | personas | scouting | interviewing | reporting
  personas: [],
  selectedPersona: null,
  interviewHistory: {},  // personaId → messages[]
  attachments: [],
  isStreaming: false,
  reportContent: '',
};

// ── 工具函数 ──────────────────────────────────────────────────────

function scrollToBottom() {
  const area = document.getElementById('chat-area');
  requestAnimationFrame(() => {
    area.scrollTop = area.scrollHeight;
  });
}

function scrollToStep(step) {
  // 滚动定位到对应步骤的内容区域
  const selectors = {
    'personas': '.personas-grid, .step-card:has(.personas-grid)',
    'scout': '.post-feed, .step-card:has(.post-feed)',
    'interview': '.interview-card, .step-card:has(.interview-card)',
    'report': '.report-card, .step-card:has(.report-card)'
  };
  const selector = selectors[step];
  if (selector) {
    const el = document.querySelector(selector);
    if (el) {
      el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      el.style.transition = 'box-shadow 0.3s';
      el.style.boxShadow = '0 0 0 2px var(--accent)';
      setTimeout(() => { el.style.boxShadow = ''; }, 1500);
    }
  }
}

function hideWelcome() {
  const welcome = document.getElementById('welcome');
  if (welcome) welcome.style.display = 'none';
}

function showProgressBar() {
  document.getElementById('progress-bar').style.display = 'flex';
  document.getElementById('study-badge').style.display = 'flex';
}

function updateStep(step, status) {
  const el = document.getElementById(`step-${step}`);
  if (el) {
    el.className = `progress-step ${status}`;
  }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 180) + 'px';
}

function handleKeyDown(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function simpleMarkdown(text) {
  return text
    .replace(/^### (.+)$/gm, '<h3>$1</h3>')
    .replace(/^## (.+)$/gm, '<h2>$1</h2>')
    .replace(/^# (.+)$/gm, '<h1>$1</h1>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/`(.+?)`/g, '<code>$1</code>')
    .replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>')
    .replace(/^---$/gm, '<hr>')
    .replace(/^- (.+)$/gm, '<li>$1</li>')
    .replace(/(<li>.*<\/li>\n?)+/g, '<ul>$&</ul>')
    .replace(/\n\n/g, '</p><p>')
    .replace(/^(?!<[hublp])/gm, '')
    .trim();
}

// ── 消息渲染 ──────────────────────────────────────────────────────

function appendUserMsg(text) {
  hideWelcome();
  const container = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg-user fade-in';
  div.innerHTML = `<div class="bubble">${escapeHtml(text)}</div>`;
  container.appendChild(div);
  scrollToBottom();
}

function appendAgentMsg(content, id) {
  const container = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg-agent fade-in';
  div.id = id || `msg-${Date.now()}`;
  div.innerHTML = `
    <div class="agent-avatar">✦</div>
    <div class="agent-content">
      <div class="agent-name">ResearchMind</div>
      <div class="agent-body">${content}</div>
    </div>
  `;
  container.appendChild(div);
  scrollToBottom();
  return div;
}

function appendStepCard(id, title, desc, status = 'running') {
  const icons = { pending: '○', running: '↻', done: '✓', error: '✗' };
  const card = document.createElement('div');
  card.className = 'step-card fade-in';
  card.id = id;
  card.innerHTML = `
    <div class="step-header" onclick="toggleStep('${id}')">
      <div class="step-status-icon ${status}">${icons[status]}</div>
      <div class="step-info">
        <div class="step-title">${title}</div>
        <div class="step-desc">${desc}</div>
      </div>
      <div class="step-expand-icon" id="${id}-expand">▼</div>
    </div>
    <div class="step-body visible" id="${id}-body"></div>
  `;
  return card;
}

function toggleStep(id) {
  const body = document.getElementById(`${id}-body`);
  const icon = document.getElementById(`${id}-expand`);
  if (body) {
    body.classList.toggle('visible');
    if (icon) icon.textContent = body.classList.contains('visible') ? '▼' : '▶';
  }
}

function updateStepStatus(cardId, status) {
  const card = document.getElementById(cardId);
  if (!card) return;
  const icons = { pending: '○', running: '↻', done: '✓', error: '✗' };
  const icon = card.querySelector('.step-status-icon');
  if (icon) {
    icon.className = `step-status-icon ${status}`;
    icon.textContent = icons[status];
  }
}

function escapeHtml(text) {
  return text
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// ── 人设卡片详情更新 ──────────────────────────────────────────────────

function buildPersonaDetailHtml(p) {
  let html = '';
  if (p.background) html += `<div class="persona-detail-section"><div class="persona-detail-label">📋 背景</div><div class="persona-detail-value">${escapeHtml(p.background)}</div></div>`;
  if (p.personality) html += `<div class="persona-detail-section"><div class="persona-detail-label">🧠 性格特征</div><div class="persona-detail-value">${escapeHtml(p.personality)}</div></div>`;
  if (p.consumer_habits) html += `<div class="persona-detail-section"><div class="persona-detail-label">🛒 消费习惯</div><div class="persona-detail-value">${escapeHtml(p.consumer_habits)}</div></div>`;
  if (p.pain_points) html += `<div class="persona-detail-section"><div class="persona-detail-label">😤 痛点</div><div class="persona-detail-value">${Array.isArray(p.pain_points) ? p.pain_points.map(v => escapeHtml(v)).join('、') : escapeHtml(p.pain_points)}</div></div>`;
  if (p.motivations) html += `<div class="persona-detail-section"><div class="persona-detail-label">🎯 动机</div><div class="persona-detail-value">${escapeHtml(p.motivations)}</div></div>`;
  if (p.digital_behavior) html += `<div class="persona-detail-section"><div class="persona-detail-label">📱 数字行为</div><div class="persona-detail-value">${escapeHtml(p.digital_behavior)}</div></div>`;
  if (p.social_media) html += `<div class="persona-detail-section"><div class="persona-detail-label">💬 社媒偏好</div><div class="persona-detail-value">${escapeHtml(p.social_media)}</div></div>`;
  if (p.core_values && p.core_values.length > 0) html += `<div class="persona-detail-section"><div class="persona-detail-label">💎 核心价值观</div><div class="persona-detail-value">${p.core_values.map(v => escapeHtml(v)).join('、')}</div></div>`;
  if (p.attitude) html += `<div class="persona-detail-section"><div class="persona-detail-label">💭 态度</div><div class="persona-detail-value">${typeof p.attitude === 'object' ? escapeHtml(JSON.stringify(p.attitude)) : escapeHtml(p.attitude)}</div></div>`;
  if (p.attitude_hypotheses) html += `<div class="persona-detail-section"><div class="persona-detail-label">🧪 态度假设</div><div class="persona-detail-value">${escapeHtml(JSON.stringify(p.attitude_hypotheses))}</div></div>`;
  if (p.description) html += `<div class="persona-detail-section"><div class="persona-detail-label">📝 完整描述</div><div class="persona-detail-value">${escapeHtml(p.description)}</div></div>`;
  if (p.scouted_updates) html += `<div class="persona-detail-section" style="margin-top:10px;padding-top:8px;border-top:1px dashed var(--border)"><div class="persona-detail-label" style="color:var(--green)">🔄 社媒侦察更新</div><div class="persona-detail-value" style="color:var(--green)">${typeof p.scouted_updates === 'object' ? escapeHtml(JSON.stringify(p.scouted_updates, null, 2)) : escapeHtml(p.scouted_updates)}</div></div>`;
  return html;
}

function updatePersonaCardDetail(cardEl, p) {
  // 更新详情面板内容
  let detailPanel = cardEl.querySelector('.persona-detail-panel');
  if (detailPanel) {
    detailPanel.innerHTML = buildPersonaDetailHtml(p);
  }
  // 更新核心价值标签
  const tagContainer = cardEl.querySelector('.persona-card-meta');
  // 更新 meta
  const metaEl = cardEl.querySelector('.persona-card-meta');
  if (metaEl && (p.age || p.occupation)) {
    metaEl.textContent = `${p.age || ''}岁 · ${escapeHtml(p.occupation || '')}`;
  }
  // 更新标签
  const tagsDiv = cardEl.querySelector('.persona-card-meta + div');
  if (tagsDiv && p.core_values) {
    tagsDiv.innerHTML = p.core_values.slice(0, 3).map(v => `<span class="persona-card-tag">${escapeHtml(v)}</span>`).join('');
  }
  // 添加"已增强"标记（仅一次）
  if (!cardEl.querySelector('.persona-enriched-badge')) {
    const badge = document.createElement('div');
    badge.className = 'persona-enriched-badge';
    badge.textContent = '✨ 已由社媒数据增强';
    cardEl.appendChild(badge);
    // 短暂闪烁提示
    cardEl.style.borderColor = 'var(--green)';
    setTimeout(() => { cardEl.style.borderColor = ''; }, 1500);
  }
}

// ── 文件上传 ──────────────────────────────────────────────────────

async function handleFileUpload(event) {
  const file = event.target.files[0];
  if (!file) return;
  
  const formData = new FormData();
  formData.append('file', file);
  if (state.studyId) formData.append('study_id', state.studyId);
  
  try {
    const res = await fetch(`${API_BASE}/research-flow/upload-context`, {
      method: 'POST', body: formData,
    });
    const data = await res.json();
    if (data.code === 0) {
      const tag = { name: file.name, text: data.data.extracted_text };
      state.attachments.push(tag);
      renderAttachments();
    }
  } catch (e) {
    console.error('上传失败', e);
  }
  event.target.value = '';
}

function renderAttachments() {
  const container = document.getElementById('attachments');
  container.innerHTML = state.attachments.map((att, i) => `
    <div class="attachment-tag">
      📄 ${escapeHtml(att.name)}
      <span class="attachment-remove" onclick="removeAttachment(${i})">×</span>
    </div>
  `).join('');
}

function removeAttachment(i) {
  state.attachments.splice(i, 1);
  renderAttachments();
}

// ── 主发送逻辑 ──────────────────────────────────────────────────────

async function sendMessage() {
  if (state.isStreaming) return;
  const input = document.getElementById('input-box');
  const text = input.value.trim();
  if (!text) return;
  
  input.value = '';
  input.style.height = 'auto';
  appendUserMsg(text);
  
  // 根据当前阶段路由
  if (state.phase === 'idle') {
    await runDesignStudy(text);
  } else if (state.phase === 'interviewing' && state.selectedPersona) {
    await runInterview(text);
  } else {
    // 通用对话
    await runDesignStudy(text);
  }
}

// ── Step 1: 研究设计 ──────────────────────────────────────────────

async function runDesignStudy(userRequest) {
  state.isStreaming = true;
  state.phase = 'designing';
  hideWelcome();
  showProgressBar();
  updateStep('design', 'active');
  
  const attachContext = state.attachments.map(a => a.text).join('\n\n');
  
  // 创建 agent 消息
  const msgDiv = appendAgentMsg('', 'design-msg');
  const cardId = 'step-design-card-' + Date.now();
  const card = appendStepCard(cardId, '🎯 设计研究框架', '正在分析研究需求，构建访谈框架...', 'running');
  msgDiv.querySelector('.agent-body').appendChild(card);
  
  const body = document.getElementById(`${cardId}-body`);
  const streamText = document.createElement('div');
  streamText.className = 'streaming-text';
  body.appendChild(streamText);
  
  try {
    const res = await fetch(`${API_BASE}/research-flow/design-study`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ user_request: userRequest, context: attachContext }),
    });
    
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let fullContent = '';
    
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      
      const lines = decoder.decode(value).split('\n');
      for (const line of lines) {
        if (!line.startsWith('data: ') || line === 'data: [DONE]') continue;
        try {
          const event = JSON.parse(line.slice(6));
          if (event.type === 'study_id') {
            state.studyId = event.study_id;
            document.getElementById('study-id-display').textContent = `研究 #${event.study_id}`;
            document.getElementById('study-title').textContent = userRequest.substring(0, 20) + '...';
          } else if (event.type === 'content') {
            fullContent += event.delta;
            streamText.innerHTML = simpleMarkdown(fullContent) + '<span class="cursor"></span>';
            scrollToBottom();
          } else if (event.type === 'step' && event.status === 'done') {
            streamText.innerHTML = `<div class="markdown">${simpleMarkdown(fullContent)}</div>`;
            updateStepStatus(cardId, 'done');
          }
        } catch (e) {}
      }
    }
    
    updateStep('design', 'done');
    updateStep('personas', 'active');
    state.phase = 'post-design';
    
    // 显示工具栏按钮
    document.getElementById('btn-personas').style.display = 'flex';
    
    // 追问确认
    appendConfirm(
      '框架已生成 ✓  接下来要怎么做？',
      [
        { label: '🧠 生成目标人设', action: 'triggerPersonas()' },
        { label: '🌐 先做社媒侦察', action: 'triggerScout()' },
        { label: '✏️ 调整研究方向', action: 'editStudy()' },
      ]
    );
    
  } catch (e) {
    updateStepStatus(cardId, 'error');
    appendAgentMsg(`<p style="color:var(--red)">出错了: ${e.message}</p>`);
  }
  
  state.isStreaming = false;
  scrollToBottom();
}

// ── Step 2: 生成人设 ──────────────────────────────────────────────

async function triggerPersonas() {
  if (!state.studyId || state.isStreaming) return;
  state.isStreaming = true;
  state.phase = 'personas';
  updateStep('personas', 'active');
  
  const msgDiv = appendAgentMsg('', 'personas-msg');
  const cardId = 'step-personas-card-' + Date.now();
  const card = appendStepCard(cardId, '👥 生成目标人设', '正在构建初始用户画像...', 'running');
  msgDiv.querySelector('.agent-body').appendChild(card);
  
  const body = document.getElementById(`${cardId}-body`);
  const grid = document.createElement('div');
  grid.className = 'personas-grid';
  body.appendChild(grid);
  
  try {
    const res = await fetch(`${API_BASE}/research-flow/search-personas`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ study_id: state.studyId, persona_description: '根据研究背景生成', max_count: 10 }),
    });
    
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      const lines = decoder.decode(value).split('\n');
      for (const line of lines) {
        if (!line.startsWith('data: ') || line === 'data: [DONE]') continue;
        try {
          const event = JSON.parse(line.slice(6));
          if (event.type === 'persona') {

            const card = document.createElement('div');
            card.className = 'persona-card';

            card.onclick = function() { this.classList.toggle('expanded'); };

            card.innerHTML = `
              <div class="persona-expand-icon">▼</div>
              <div class="persona-card-avatar">${emoji}</div>
              <div class="persona-card-name">${escapeHtml(p.name || '')}</div>
              <div class="persona-card-meta">${p.age || ''}岁 · ${escapeHtml(p.occupation || '')}</div>
              <div>
                ${(p.core_values || []).slice(0, 3).map(v => `<span class="persona-card-tag">${escapeHtml(v)}</span>`).join('')}
              </div>
              <div class="persona-detail-panel">
                ${buildPersonaDetailHtml(p)}
              </div>
            `;
            grid.appendChild(card);
            scrollToBottom();
          } else if (event.type === 'step' && event.status === 'done') {
            updateStepStatus(cardId, 'done');
          }
        } catch (e) {}
      }
    }
    
    updateStep('personas', 'done');
    updateStep('scout', 'active');
    
    document.getElementById('btn-scout').style.display = 'flex';
    document.getElementById('btn-interview').style.display = 'flex';
    
    appendConfirm(
      `已生成 ${state.personas.length} 个用户画像。选择下一步操作：`,
      [
        { label: '🌐 社媒侦察', action: 'triggerScout()' },
        { label: '🎤 自动深度访谈', action: 'triggerAutoInterview()' },
        { label: '📊 直接生成报告', action: 'triggerReport()' },
      ]
    );
    
  } catch (e) {
    updateStepStatus(cardId, 'error');
    appendAgentMsg(`<p style="color:var(--red)">生成人设失败: ${e.message}</p>`);
  }
  
  state.isStreaming = false;
}

// ── Step 3: 社媒侦察 ──────────────────────────────────────────────

async function triggerScout() {
  if (!state.studyId || state.isStreaming) return;
  state.isStreaming = true;
  state.phase = 'scouting';
  updateStep('scout', 'active');

  // 从研究标题提取关键词（作为研究主题，不是搜索关键词）
  const title = document.getElementById('study-title').textContent.replace('...', '');
  const keywords = title.split(/[，,、\s]+/).filter(k => k.length > 1).slice(0, 3);
  if (keywords.length === 0) keywords.push('用户研究');

  const msgDiv = appendAgentMsg('', 'scout-msg');
  const cardId = 'step-scout-card-' + Date.now();
  const card = appendStepCard(cardId, '🌐 社交媒体侦察', `为每个人设搜索专属社媒内容...`, 'running');
  msgDiv.querySelector('.agent-body').appendChild(card);

  const body = document.getElementById(`${cardId}-body`);

  // 人设侦察进度区
  const progressDiv = document.createElement('div');
  progressDiv.id = 'scout-progress';
  progressDiv.style.cssText = 'margin-bottom:12px;font-size:12px;color:var(--text-secondary)';
  body.appendChild(progressDiv);

  // 帖子流容器
  const postsContainer = document.createElement('div');
  postsContainer.className = 'post-feed';

  body.appendChild(postsContainer);

  // 当前正在侦察的人设
  let currentPersonaBlock = null;
  let personaPostCount = {};

  try {
    const res = await fetch(`${API_BASE}/research-flow/scout-and-build`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        study_id: state.studyId,
        keywords: keywords,
        platforms: ['小红书', '微博', '抖音'],
        // 不传 persona_ids，让后端对所有人设执行
      }),
    });

    const reader = res.body.getReader();
    const decoder = new TextDecoder();

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      const lines = decoder.decode(value).split('\n');
      for (const line of lines) {
        if (!line.startsWith('data: ') || line === 'data: [DONE]') continue;
        try {
          const event = JSON.parse(line.slice(6));

          if (event.type === 'persona_scout_start') {
            // 新人设开始侦察
            const pName = event.persona_name;
            const pKeywords = event.keywords || [];
            progressDiv.innerHTML = `<span style="color:var(--accent)">🔍</span> 正在为 <b>${escapeHtml(pName)}</b> 搜索: ${pKeywords.map(k => `"${escapeHtml(k)}"`).join(', ')}`;
            personaPostCount[event.persona_id] = 0;

            // 创建该人设的帖子区块
            currentPersonaBlock = document.createElement('div');
            currentPersonaBlock.className = 'persona-scout-block';
            currentPersonaBlock.dataset.personaId = event.persona_id;
            currentPersonaBlock.innerHTML = `<div class="persona-scout-header" style="font-size:11px;color:var(--text-dim);margin:8px 0 4px;padding:4px 8px;background:var(--surface3);border-radius:4px">👤 ${escapeHtml(pName)} 的社媒声音</div>`;
            postsContainer.appendChild(currentPersonaBlock);

          } else if (event.type === 'post') {
            const post = event.post;

            // 添加到当前人设区块
            const targetContainer = currentPersonaBlock || postsContainer;
            const div = document.createElement('div');
            div.className = 'post-item';
            div.innerHTML = `
              <div class="post-header">
                <span class="post-platform ${post.platform}">${post.platform}</span>
                <span class="post-sentiment">${post.sentiment === 'positive' ? '😊' : post.sentiment === 'negative' ? '😤' : '😐'}</span>
              </div>
              <div class="post-content">${escapeHtml(post.content || '')}</div>
            `;
            targetContainer.appendChild(div);
            scrollToBottom();

            // 更新计数
            if (event.persona_id) {
              personaPostCount[event.persona_id] = (personaPostCount[event.persona_id] || 0) + 1;
            }

          } else if (event.type === 'persona_insights') {
            // 该人设的洞察 — 嵌入到对应人设区块内
            const block = postsContainer.querySelector(`.persona-scout-block[data-persona-id="${event.persona_id}"]`);
            if (block && event.insights.length > 0) {
              const summaryDiv = document.createElement('div');
              summaryDiv.className = 'insight-item';
              summaryDiv.style.cssText = 'margin:6px 0;padding:6px 10px;background:var(--surface2);border-radius:6px;border-left:2px solid var(--accent)';
              summaryDiv.innerHTML = `<span style="font-size:12px;color:var(--text-dim)">💡 洞察</span> <span style="font-size:12px">${escapeHtml(event.insights[0])}</span>`;
              block.appendChild(summaryDiv);
              scrollToBottom();
            }

          } else if (event.type === 'updated_persona') {
            const p = event.persona;
            const idx = state.personas.findIndex(x => x.id === p.id);
            if (idx >= 0) {
              state.personas[idx] = p;
              // 更新页面上所有对应的 persona 卡片
              document.querySelectorAll(`.persona-card[data-persona-id="${p.id}"]`).forEach(c => updatePersonaCardDetail(c, p));
            }

          } else if (event.type === 'persona_scout_done') {
            // 该人设侦察完成
            const pName = event.persona_name;
            const count = personaPostCount[event.persona_id] || 0;
            progressDiv.innerHTML = `<span style="color:var(--green)">✓</span> ${escapeHtml(pName)} 侦察完成（${count} 条帖子）`;

          } else if (event.type === 'step' && event.step === 'build_persona' && event.status === 'done') {
            progressDiv.innerHTML = `<span style="color:var(--green)">✓</span> 全部 ${event.total_personas || state.personas.length} 个人设侦察完成`;
            updateStepStatus(cardId, 'done');
          }
        } catch (e) {}
      }
    }

    updateStep('scout', 'done');
    updateStep('interview', 'active');

    appendConfirm(
      '社媒侦察完成，每个人设已根据专属的真实用户声音增强 ✓  建议进行深度访谈来挖掘更深层的动机。',
      [
        { label: '🎤 自动深度访谈', action: 'triggerAutoInterview()' },
        { label: '📊 直接生成报告', action: 'triggerReport()' },
      ]
    );

  } catch (e) {
    updateStepStatus(cardId, 'error');
  }

  state.isStreaming = false;
}

// ── Step 4-auto: 自动深度访谈 ────────────────────────────────────

async function triggerAutoInterview() {
  if (!state.studyId || state.isStreaming) return;
  state.isStreaming = true;
  state.phase = 'interviewing';
  updateStep('interview', 'active');

  const msgDiv = appendAgentMsg('', 'auto-interview-msg');
  const cardId = 'step-auto-interview-card-' + Date.now();
  const card = appendStepCard(cardId, '🎤 自动深度访谈', '正在基于访谈框架对所有用户人设执行访谈...', 'running');
  msgDiv.querySelector('.agent-body').appendChild(card);

  const body = document.getElementById(`${cardId}-body`);

  // 进度条
  const progressDiv = document.createElement('div');
  progressDiv.className = 'auto-interview-progress';
  progressDiv.innerHTML = `
    <div style="font-size:12px;color:var(--text-secondary);margin-bottom:8px" id="ai-progress-text">准备中...</div>
    <div style="background:var(--surface3);border-radius:4px;height:4px;overflow:hidden">
      <div id="ai-progress-bar" style="background:var(--accent);height:100%;width:0%;transition:width 0.3s"></div>
    </div>
  `;
  body.appendChild(progressDiv);

  // 问题列表
  const questionsDiv = document.createElement('div');
  questionsDiv.id = 'ai-questions';
  questionsDiv.style.cssText = 'margin:10px 0;display:none';
  body.appendChild(questionsDiv);

  // 访谈记录容器
  const interviewContainer = document.createElement('div');
  interviewContainer.className = 'interview-results';
  body.appendChild(interviewContainer);

  let totalPersonas = 0;
  let completedPersonas = 0;
  let currentPersonaId = null;
  let currentChatDiv = null;
  let currentMsgs = null;

  try {
    const res = await fetch(`${API_BASE}/research-flow/auto-interview`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ study_id: state.studyId }),
    });

    const reader = res.body.getReader();
    const decoder = new TextDecoder();

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      const lines = decoder.decode(value).split('\n');
      for (const line of lines) {
        if (!line.startsWith('data: ') || line === 'data: [DONE]') continue;
        try {
          const event = JSON.parse(line.slice(6));

          if (event.type === 'status') {
            document.getElementById('ai-progress-text').textContent = event.message;
            scrollToBottom();
          }

          else if (event.type === 'questions') {
            questionsDiv.style.display = 'block';
            questionsDiv.innerHTML = `<div style="font-size:11px;color:var(--text-dim);margin-bottom:4px">📋 访谈提纲 (${event.count} 题)</div>` +
              event.questions.map((q, i) => `<div style="font-size:12px;color:var(--text-secondary);padding:2px 0">${i+1}. ${escapeHtml(q)}</div>`).join('');
            scrollToBottom();
          }

          else if (event.type === 'interview_start') {
            totalPersonas = event.total;
            currentPersonaId = event.persona_id;
            const name = event.persona_name;

            // 更新进度
            completedPersonas = event.index;
            document.getElementById('ai-progress-text').textContent = `正在访谈 ${name}（${event.index + 1}/${event.total}）...`;
            document.getElementById('ai-progress-bar').style.width = `${(event.index / event.total * 100).toFixed(0)}%`;

            // 创建该人设的访谈卡片
            const personaBlock = document.createElement('div');
            personaBlock.className = 'interview-persona-block';
            personaBlock.id = `ai-persona-${currentPersonaId}`;
            personaBlock.innerHTML = `<div class="interview-header">
              <div class="interview-persona-avatar">${['👩','👨','🧑','👩‍💼','👨‍💻'][event.index % 5]}</div>
              <div>
                <div class="interview-persona-name">${escapeHtml(name)}</div>
                <div class="interview-persona-meta">自动访谈进行中...</div>
              </div>
              <div class="interview-emotion">🎤 访谈中</div>
            </div>`;
            interviewContainer.appendChild(personaBlock);

            currentChatDiv = document.createElement('div');
            currentChatDiv.className = 'interview-messages';
            currentChatDiv.style.maxHeight = '400px';
            personaBlock.appendChild(currentChatDiv);
            scrollToBottom();
          }

          else if (event.type === 'qa') {
            if (!currentMsgs && currentChatDiv) {
              currentMsgs = currentChatDiv;
            }
            if (currentChatDiv) {
              const qaDiv = document.createElement('div');
              qaDiv.style.cssText = 'padding:6px 0;border-bottom:1px solid var(--border)';
              qaDiv.innerHTML = `
                <div class="interview-msg-q" style="margin-bottom:4px">${escapeHtml(event.question)}</div>
                <div class="interview-msg-a">${escapeHtml(event.answer)}</div>
              `;
              currentChatDiv.appendChild(qaDiv);

              // 更新人设的 interviewHistory
              if (!state.interviewHistory[event.persona_id]) state.interviewHistory[event.persona_id] = [];
              state.interviewHistory[event.persona_id].push({ role: 'user', content: event.question });
              state.interviewHistory[event.persona_id].push({ role: 'assistant', content: event.answer });
              scrollToBottom();
            }
          }

          else if (event.type === 'interview_done') {
            completedPersonas++;
            document.getElementById('ai-progress-bar').style.width = `${(completedPersonas / totalPersonas * 100).toFixed(0)}%`;

            const personaBlock = document.getElementById(`ai-persona-${event.persona_id}`);
            if (personaBlock) {
              const meta = personaBlock.querySelector('.interview-persona-meta');
              if (meta) meta.textContent = `${event.qa_count} 轮问答完成 ✓`;
              const emotion = personaBlock.querySelector('.interview-emotion');
              if (emotion) emotion.textContent = '✅ 完成';
            }

            if (completedPersonas >= totalPersonas) {
              document.getElementById('ai-progress-text').textContent = `全部 ${totalPersonas} 位用户访谈完成 ✓`;
              document.getElementById('ai-progress-bar').style.width = '100%';
            }
            scrollToBottom();
          }

          else if (event.type === 'step' && event.step === 'auto_interview' && event.status === 'done') {
            updateStepStatus(cardId, 'done');
            updateStep('interview', 'done');
            updateStep('report', 'active');

            document.getElementById('btn-report').style.display = 'flex';

            appendConfirm(
              `自动访谈完成 ✓  共对 ${totalPersonas} 位用户进行了深度访谈，每人 ${event.questions_per_persona} 个问题。接下来生成研究报告？`,
              [
                { label: '📊 生成研究报告', action: 'triggerReport()' },
                { label: '🎤 继续手动追问', action: 'showInterviewPicker()' },
              ]
            );
          }

        } catch (e) {}
      }
    }

  } catch (e) {
    updateStepStatus(cardId, 'error');
    appendAgentMsg(`<p style="color:var(--red)">自动访谈失败: ${e.message}</p>`);
  }

  state.isStreaming = false;
  scrollToBottom();
}

// ── Step 4: 深度访谈（手动）──────────────────────────────────────

function selectPersona(personaId) {
  state.selectedPersona = state.personas.find(p => p.id === personaId);
  document.querySelectorAll('.persona-card').forEach(c => {
    c.classList.toggle('selected', c.dataset.personaId === personaId);
  });
}

function showInterviewPicker() {
  if (state.personas.length === 0) {
    alert('请先生成用户人设');
    return;
  }
  
  const msgDiv = appendAgentMsg('', 'interview-picker');
  const body = msgDiv.querySelector('.agent-body');
  
  const confirm = document.createElement('div');
  confirm.className = 'confirm-block';
  confirm.innerHTML = `
    <div class="confirm-question">选择要访谈的人设：</div>
    <div class="personas-grid" id="interview-persona-select">
      ${state.personas.map((p, i) => {
        const emojis = ['👩', '👨', '🧑', '👩‍💼', '👨‍💻'];
        return `
        <div class="persona-card" onclick="startInterviewWith('${p.id}')" style="cursor:pointer">
          <div class="persona-card-avatar">${emojis[i % 5]}</div>
          <div class="persona-card-name">${escapeHtml(p.name || '')}</div>
          <div class="persona-card-meta">${p.age || ''}岁 · ${escapeHtml(p.occupation || '')}</div>
        </div>`;
      }).join('')}
    </div>
  `;
  body.appendChild(confirm);
  scrollToBottom();
}

function startInterviewWith(personaId) {
  selectPersona(personaId);
  state.phase = 'interviewing';
  updateStep('interview', 'active');
  
  document.getElementById('btn-report').style.display = 'flex';
  
  const persona = state.personas.find(p => p.id === personaId);
  if (!persona) return;
  
  const emojis = ['👩', '👨', '🧑', '👩‍💼', '👨‍💻'];
  const emojiIdx = state.personas.indexOf(persona) % 5;
  
  const msgDiv = appendAgentMsg('', `interview-${personaId}`);
  const body = msgDiv.querySelector('.agent-body');
  
  const chatBlock = document.createElement('div');
  chatBlock.className = 'interview-chat';
  chatBlock.id = `interview-chat-${personaId}`;
  chatBlock.innerHTML = `
    <div class="interview-header">
      <div class="interview-persona-avatar">${emojis[emojiIdx]}</div>
      <div>
        <div class="interview-persona-name">${escapeHtml(persona.name || '')}</div>
        <div class="interview-persona-meta">${persona.age || ''}岁 · ${escapeHtml(persona.occupation || '')} · ${escapeHtml(persona.city || '')}</div>
      </div>
      <div class="interview-emotion" id="emotion-${personaId}">😌 沉稳</div>
    </div>
    <div class="interview-messages" id="interview-msgs-${personaId}"></div>
    <div class="follow-up-hints" id="hints-${personaId}"></div>
  `;
  body.appendChild(chatBlock);
  
  // 加个欢迎消息
  const msgs = document.getElementById(`interview-msgs-${personaId}`);
  const welcome = document.createElement('div');
  welcome.className = 'interview-msg-a';
  welcome.textContent = `（已就绪，请开始提问。可以在下方输入框直接与 ${persona.name} 对话）`;
  msgs.appendChild(welcome);
  
  document.getElementById('input-box').placeholder = `向 ${persona.name} 提问...`;
  scrollToBottom();
}

async function runInterview(question) {
  if (!state.selectedPersona || !state.studyId) return;
  state.isStreaming = true;
  
  const personaId = state.selectedPersona.id;
  const msgs = document.getElementById(`interview-msgs-${personaId}`);
  
  if (!msgs) {
    startInterviewWith(personaId);
    state.isStreaming = false;
    return;
  }
  
  // 显示用户问题
  const qDiv = document.createElement('div');
  qDiv.className = 'interview-msg-q';
  qDiv.textContent = question;
  msgs.appendChild(qDiv);
  
  // 加载动画
  const loadingDiv = document.createElement('div');
  loadingDiv.className = 'interview-msg-a';
  loadingDiv.innerHTML = '<div class="loading-dots"><span></span><span></span><span></span></div>';
  msgs.appendChild(loadingDiv);
  
  const history = state.interviewHistory[personaId] || [];
  
  try {
    const res = await fetch(`${API_BASE}/research-flow/interview/stream`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        study_id: state.studyId,
        persona_id: personaId,
        question: question,
        conversation_history: history,
      }),
    });
    
    loadingDiv.innerHTML = '<span class="cursor"></span>';
    let fullResponse = '';
    
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      const lines = decoder.decode(value).split('\n');
      for (const line of lines) {
        if (!line.startsWith('data: ') || line === 'data: [DONE]') continue;
        try {
          const event = JSON.parse(line.slice(6));
          if (event.type === 'content') {
            fullResponse += event.delta;
            loadingDiv.textContent = fullResponse;
            loadingDiv.innerHTML += '<span class="cursor"></span>';
          }
        } catch (e) {}
      }
    }
    
    loadingDiv.textContent = fullResponse;
    
    // 更新历史
    if (!state.interviewHistory[personaId]) state.interviewHistory[personaId] = [];
    state.interviewHistory[personaId].push({ role: 'user', content: question });
    state.interviewHistory[personaId].push({ role: 'assistant', content: fullResponse });
    
    // 随机建议追问
    const hints = [
      '你能说得更具体一些吗？',
      '这种感觉是什么时候开始的？',
      '你有没有试过其他方案？',
      '身边的人有类似感受吗？',
      '如果这个问题解决了，会有什么不同？',
    ];
    const hintContainer = document.getElementById(`hints-${personaId}`);
    if (hintContainer) {
      const selected = hints.sort(() => Math.random() - 0.5).slice(0, 3);
      hintContainer.innerHTML = selected.map(h =>
        `<span class="hint-chip" onclick="useHint('${escapeHtml(h)}')">${escapeHtml(h)}</span>`
      ).join('');
    }
    
  } catch (e) {
    loadingDiv.textContent = `访谈出错: ${e.message}`;
  }
  
  msgs.scrollTop = msgs.scrollHeight;
  state.isStreaming = false;
  scrollToBottom();
}

function useHint(text) {
  const input = document.getElementById('input-box');
  input.value = text;
  input.focus();
}

// ── Step 5: 生成报告 ──────────────────────────────────────────────

async function triggerReport() {
  if (!state.studyId || state.isStreaming) return;
  state.isStreaming = true;
  state.phase = 'reporting';
  updateStep('report', 'active');
  
  const msgDiv = appendAgentMsg('', 'report-msg');
  const cardId = 'step-report-card-' + Date.now();
  const card = appendStepCard(cardId, '📊 生成研究报告', '整合人设数据与访谈洞察...', 'running');
  msgDiv.querySelector('.agent-body').appendChild(card);
  
  const body = document.getElementById(`${cardId}-body`);
  const reportDiv = document.createElement('div');
  reportDiv.className = 'report-container markdown';
  body.appendChild(reportDiv);
  
  let fullReport = '';
  
  // 整理访谈记录
  const transcripts = Object.entries(state.interviewHistory).map(([id, msgs]) => ({
    persona_id: id,
    messages: msgs,
  }));
  
  try {
    const res = await fetch(`${API_BASE}/research-flow/generate-report`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        study_id: state.studyId,
        personas: state.personas,
        interview_transcripts: transcripts,
        format: 'markdown',
      }),
    });
    
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      const lines = decoder.decode(value).split('\n');
      for (const line of lines) {
        if (!line.startsWith('data: ') || line === 'data: [DONE]') continue;
        try {
          const event = JSON.parse(line.slice(6));
          if (event.type === 'content') {
            fullReport += event.delta;
            reportDiv.innerHTML = simpleMarkdown(fullReport) + '<span class="cursor"></span>';
            scrollToBottom();
          } else if (event.type === 'step' && event.status === 'done') {
            reportDiv.innerHTML = simpleMarkdown(fullReport);
            updateStepStatus(cardId, 'done');
            state.reportContent = fullReport;
          }
        } catch (e) {}
      }
    }
    
    updateStep('report', 'done');
    
    appendAgentMsg(`
      <div class="confirm-block">
        <div class="confirm-question">✅ 研究报告已生成完毕</div>
        <div class="confirm-options">
          <button class="confirm-btn primary" onclick="exportReport()">📥 导出 Markdown</button>
          <button class="confirm-btn" onclick="copyReport()">📋 复制全文</button>
          <button class="confirm-btn" onclick="continueInterview()">🎤 继续访谈</button>
        </div>
      </div>
    `);
    
  } catch (e) {
    updateStepStatus(cardId, 'error');
    appendAgentMsg(`<p style="color:var(--red)">报告生成失败: ${e.message}</p>`);
  }
  
  state.isStreaming = false;
  scrollToBottom();
}

// ── 确认交互 ──────────────────────────────────────────────────────

function appendConfirm(question, options) {
  const msgDiv = appendAgentMsg('', `confirm-${Date.now()}`);
  const body = msgDiv.querySelector('.agent-body');
  const block = document.createElement('div');
  block.className = 'confirm-block fade-in';
  block.innerHTML = `
    <div class="confirm-question">${escapeHtml(question)}</div>
    <div class="confirm-options">
      ${options.map((opt, i) => `
        <button class="confirm-btn ${i === 0 ? 'primary' : ''}" onclick="${opt.action}">${escapeHtml(opt.label)}</button>
      `).join('')}
    </div>
  `;
  body.appendChild(block);
  scrollToBottom();
}

}

function exportReport() {
  if (!state.reportContent) {
    alert('暂无报告内容，请先生成报告');
    return;
  }
  const blob = new Blob([state.reportContent], { type: 'text/markdown' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `research-report-${state.studyId || Date.now()}.md`;
  a.click();
  URL.revokeObjectURL(url);
}

function copyReport() {
  if (!state.reportContent) return;
  navigator.clipboard.writeText(state.reportContent).then(() => {
    alert('报告已复制到剪贴板');
  });
}

function continueInterview() {
  if (state.personas.length > 0) {
    showInterviewPicker();
  }
}

function editStudy() {
  document.getElementById('input-box').value = '请调整研究方向：';

}
